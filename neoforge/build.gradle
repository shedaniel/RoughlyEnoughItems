plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

base {
    archivesName = rootProject.name
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

processResources {
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
    inputs.property "version", project.version
}

repositories {
    maven { url "https://www.cursemaven.com" }
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven" }
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
        // For Gradle 5.1 and above, limit it to just AE2
        content {
            includeGroup 'appeng'
        }
    }
}

sourceSets {
    serverComponent {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

processServerComponentResources {
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
    inputs.property "version", project.version
}

def depProjects = [":api", ":runtime", ":default-plugin"]

dependencies {
    neoForge("net.neoforged:neoforge:${rootProject.neoforge_version}")
    api("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    api("dev.architectury:architectury-neoforge:${architectury_version}")

    depProjects.forEach {
        common(project(path: it)) { transitive false }
        shadowCommon(project(path: it, configuration: "transformProductionNeoForge")) { transitive false }
    }
}

def modRuntime(str) {
    dependencies.localRuntime(str)
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    // Loom modifies the jar output, so build on top of it rather than rebuilding from the raw source set.
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    from rootProject.file("LICENSE")
}

assemble.dependsOn shadowJar

java {
    withSourcesJar()
}

sourcesJar {
    afterEvaluate {
        depProjects.forEach {
            def depSources = project(it).sourcesJar
            dependsOn depSources
            from depSources.archiveFile.map { zipTree(it) }
        }
    }
}

task serverOnlyJar(type: Jar, dependsOn: [shadowJar]) {
    archiveClassifier = "server-only"
    from(zipTree(shadowJar.archiveFile.get().asFile)) {
        exclude "META-INF/neoforge.mods.toml", "mezz/**", "me/shedaniel/rei/forge/RoughlyEnoughItemsForge.class", "me/shedaniel/rei/forge/JEIStub.class"
    }
    from(sourceSets.serverComponent.output)
}

tasks.build {
    dependsOn tasks.serverOnlyJar
}

// Redirect the published variants to use the shadow jar while keeping POM metadata from components.java.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.name + "-" + project.name
            from components.java
        }
        ["api", "default-plugin"].forEach { projectName ->
            create(projectName + "NeoForge", MavenPublication.class) { publication ->
                publication.artifactId = rootProject.name + "-" + projectName + "-neoforge"
                project.afterEvaluate {
                    def depProject = project(":" + projectName)
                    def normalArtifact, sourceArtifact
                    publication.artifact(depProject.fakeForgeJar) { classifier null; normalArtifact = it }
                    def depSourcesJar = depProject.sourcesJar
                    publication.artifact(depSourcesJar) {
                        builtBy depSourcesJar
                        classifier "sources"
                        sourceArtifact = it
                    }

                    from components.java
                    publication.setArtifacts([normalArtifact, sourceArtifact])
                }
            }
        }
    }
}

unifiedPublishing {
    if (rootProject.neoforge_pr != "") return
    project {
        displayName = "[NeoForge $rootProject.supported_version] v$project.version"
        releaseType = "beta"
        gameVersions = ["26.1.2"]
        gameLoaders = ["neoforge"]
        changelog = rootProject.releaseChangelog

        mainPublication shadowJar

        relations {
            depends {
                curseforge = "architectury-api"
                modrinth = "architectury-api"
            }
            depends {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
        }

        if (project.hasProperty("danielshe_curse_api_key") || System.getenv("danielshe_curse_api_key") != null) {
            curseforge {
                token = project.hasProperty("danielshe_curse_api_key") ? project.property("danielshe_curse_api_key") : System.getenv("danielshe_curse_api_key")
                id = "310111"
                gameVersions.addAll "Java 25"

                relations {
                    depends "roughly-enough-items-hacks"
                }
            }
        }

        if (project.hasProperty("modrinth_key") || System.getenv("modrinth_key") != null) {
            modrinth {
                token = project.hasProperty("modrinth_key") ? project.property("modrinth_key") : System.getenv("modrinth_key")
                id = "nfn13YXA"
                version = "$project.version+$project.name"
            }
        }
    }
    project {
        displayName = "[NeoForge $rootProject.supported_version] v$project.version"
        releaseType = "release"
        gameVersions = ["26.1.2"]
        gameLoaders = ["neoforge"]
        changelog = rootProject.releaseChangelog

        mainPublication serverOnlyJar

        relations {
            depends {
                curseforge = "architectury-api"
                modrinth = "architectury-api"
            }
            depends {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
        }

        if (project.hasProperty("danielshe_curse_api_key") || System.getenv("danielshe_curse_api_key") != null) {
            curseforge {
                token = project.hasProperty("danielshe_curse_api_key") ? project.property("danielshe_curse_api_key") : System.getenv("danielshe_curse_api_key")
                id = "567899"
                gameVersions.addAll "Java 25"
            }
        }

        if (project.hasProperty("modrinth_key") || System.getenv("modrinth_key") != null) {
            modrinth {
                releaseType = "release"
                token = project.hasProperty("modrinth_key") ? project.property("modrinth_key") : System.getenv("modrinth_key")
                id = "OM4ZYSws"
                version = "$project.version+$project.name"
            }
        }
    }
}

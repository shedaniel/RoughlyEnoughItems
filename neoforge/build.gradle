plugins {
    id("dev.architectury.loom-no-remap")
    id("maven-publish")
}

version = "26.1.1.15-beta"
group = "me.shedaniel"

base {
    archivesName = "RoughlyEnoughItems-neoforge"
}

repositories {
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.architectury.dev" }
    maven { url "https://maven.terraformersmc.com/releases" }
    maven { url "https://maven.neoforged.net/releases/" }
}

sourceSets {
    main {
        java.srcDirs = [
                layout.buildDirectory.dir("generated/neoforgeSources/main/java")
        ]
        resources.srcDirs = [
                "../runtime/src/main/resources",
                "../neoforge/src/main/resources"
        ]
    }
    test {
        java.srcDirs = [
                "../runtime/src/test/java"
        ]
    }
}

def prepareNeoForgeSources = tasks.register("prepareNeoForgeSources", Sync) {
    into layout.buildDirectory.dir("generated/neoforgeSources/main/java")
    outputs.upToDateWhen { false }

    from("../api/src/main/java")
    from("../runtime/src/main/java") {
        exclude("me/shedaniel/rei/impl/client/registry/screen/DefaultScreenOverlayRenderer.java")
    }
    from("../default-plugin/src/main/java")
    from("../neoforge/src/main/java")

    exclude("me/shedaniel/rei/REIModMenuEntryPoint.java")
    exclude("me/shedaniel/rei/mixin/forge/MixinEffectsInInventory.java")

    filter { String line ->
        line = line.replaceAll(/\bGuiGraphics\b/, "GuiGraphicsExtractor")
        line = line
                .replace(".drawCenteredString(", ".centeredText(")
                .replace(".drawWordWrap(", ".textWithWordWrap(")
                .replace(".drawString(", ".text(")
                .replace(".renderOutline(", ".outline(")
                .replace(".hLine(", ".horizontalLine(")
                .replace(".vLine(", ".verticalLine(")
                .replace(".renderItemDecorations(", ".itemDecorations(")
                .replace(".renderItem(", ".item(")
                .replace("graphics.renderDeferredElements();", "graphics.extractDeferredElements(mouseX, mouseY, delta);")
                .replace("graphics instanceof GuiGraphicsExtractor guiGraphics ? guiGraphics : new GuiGraphicsExtractor(graphics)", "graphics")
                .replace("graphics instanceof GuiGraphicsExtractor existing ? existing : new GuiGraphicsExtractor(graphics)", "graphics")
                .replace('initializeEntryPoint(true, "me.shedaniel.rei.REIModMenuEntryPoint");', "")
        line = line.replaceAll(/(\w+)\.withFreshScissorStack\(/, 'me.shedaniel.rei.impl.client.gui.forge.REIGuiGraphicsCompat.withFreshScissorStack($1, ')
        line = line.replaceAll(/(\w+)\.innerBlit\(/, 'me.shedaniel.rei.impl.client.gui.forge.REIGuiGraphicsCompat.innerBlit($1, ')
        return line
    }
}

loom {
    noIntermediateMappings()

    mods {
        roughlyenoughitems {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")

    neoForge("net.neoforged:neoforge:${project.neoforge_version}")
    compileOnly("net.fabricmc:fabric-loader:${project.fabricloader_version}")
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    implementation("dev.architectury:architectury-neoforge:${architectury_version}")

    testImplementation("org.junit.jupiter:junit-jupiter:5.8.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.8.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn prepareNeoForgeSources
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs += ["-Xmaxerrs", "120"]
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn prepareNeoForgeSources
}

jar {
    exclude("net/**")

    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}

plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

base {
    archivesName = rootProject.name
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    inputs.property "version", project.version
}

loom {
    accessWidenerPath = file("src/main/resources/roughlyenoughitems.accessWidener")
}

def depProjects = [":api", ":runtime", ":default-plugin"]

dependencies {
    implementation("net.fabricmc:fabric-loader:${project.fabricloader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api}")
    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(module: "fabric-api")
    }
    //localRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive false }
    implementation("dev.architectury:architectury-fabric:${architectury_version}")

    depProjects.forEach {
        common(project(path: it)) { transitive false }
        shadowCommon(project(path: it, configuration: "transformProductionFabric")) { transitive false }
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    // Loom modifies the jar output (e.g. Jar-in-Jar metadata in fabric.mod.json), so build on top of it
    // rather than rebuilding from the raw source set.
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    from rootProject.file("LICENSE")
}

assemble.dependsOn shadowJar

java {
    withSourcesJar()
}

sourcesJar {
    afterEvaluate {
        depProjects.forEach {
            def depSources = project(it).sourcesJar
            dependsOn depSources
            from depSources.archiveFile.map { zipTree(it) }
        }
    }
}

// Redirect the published variants to use the shadow jar (which carries the bundled common classes)
// while keeping the POM dependency metadata from components.java.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.name + "-" + project.name
            from components.java
        }
        ["api", "default-plugin", "runtime"].forEach { projectName ->
            create(projectName + "Fabric", MavenPublication.class) { publication ->
                publication.artifactId = rootProject.name + "-" + projectName + "-fabric"
                project.afterEvaluate {
                    def depProject = project(":" + projectName)
                    def normalArtifact, sourceArtifact
                    publication.artifact(depProject.fakeJar) { classifier null; normalArtifact = it }
                    def depSourcesJar = depProject.sourcesJar
                    publication.artifact(depSourcesJar) {
                        builtBy depSourcesJar
                        classifier "sources"
                        sourceArtifact = it
                    }

                    from components.java
                    publication.setArtifacts([normalArtifact, sourceArtifact])
                }
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[Fabric $rootProject.supported_version] v$project.version"
        releaseType = rootProject.unstable == "false" ? "release" : "alpha"
        gameVersions = ["26.1", "26.1.1", "26.1.2"]
        gameLoaders = ["fabric"]
        changelog = rootProject.releaseChangelog

        mainPublication shadowJar

        relations {
            depends {
                curseforge = "architectury-api"
                modrinth = "architectury-api"
            }
            depends {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
            depends {
                curseforge = "fabric-api"
                modrinth = "fabric-api"
            }
        }

        if (project.hasProperty("danielshe_curse_api_key") || System.getenv("danielshe_curse_api_key") != null) {
            curseforge {
                token = project.hasProperty("danielshe_curse_api_key") ? project.property("danielshe_curse_api_key") : System.getenv("danielshe_curse_api_key")
                id = "310111"
                gameVersions.addAll "Java 25"
            }
        }

        if (project.hasProperty("modrinth_key") || System.getenv("modrinth_key") != null) {
            modrinth {
                token = project.hasProperty("modrinth_key") ? project.property("modrinth_key") : System.getenv("modrinth_key")
                id = "nfn13YXA"
                version = "$project.version+$project.name"
//                gameVersions.addAll project.minecraft_version
            }
        }
    }
}

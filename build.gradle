plugins {
    id("net.fabricmc.fabric-loom") version("${loom_version}")
    id("maven-publish")
}

import java.text.SimpleDateFormat

def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "9999"
version = rootProject.base_version + "." + runNumber + (rootProject.unstable.toBoolean() ? "-alpha" : "")
group = "me.shedaniel"

base {
    archivesName = "${rootProject.name}-fabric"
}

repositories {
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.architectury.dev" }
    maven { url "https://maven.terraformersmc.com/releases" }
}

sourceSets {
    main {
        java.srcDirs = [
                "api/src/main/java",
                "runtime/src/main/java",
                "default-plugin/src/main/java",
                "fabric/src/main/java"
        ]
        resources.srcDirs = [
                "runtime/src/main/resources",
                "fabric/src/main/resources"
        ]
    }
    test {
        java.srcDirs = [
                "runtime/src/test/java"
        ]
    }
}

loom {
    noIntermediateMappings()
    enableTransitiveAccessWideners = false
    accessWidenerPath = file("fabric/src/main/resources/roughlyenoughitems.accessWidener")

    mods {
        roughlyenoughitems {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")

    implementation("net.fabricmc:fabric-loader:${project.fabricloader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api}")
    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(module: "fabric-api")
    }
    // Temporary migration bridge:
    // the 26.1 branch still compiles against a locally remapped Architectury classes jar.
    // The shim sources under fabric/src/main/java/dev/architectury/injectables/targets keep
    // dev-time target resolution working until this can move back to a published dependency.
    implementation(files("architectury-19.0.9999.jar"))

    testImplementation("org.junit.jupiter:junit-jupiter:5.8.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.8.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named("validateAccessWidener").configure {
    enabled = false
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}

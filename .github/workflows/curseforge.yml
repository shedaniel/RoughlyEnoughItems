name: CF CI

on:
  push:
    branches:
      - 3.x
      - 4.x-unstable
      - 4.x
      - 5.x
      - 6.x
      - 6.x-1.17
      - 7.x-1.18
      - 8.x-1.18.2
      - 9.x-1.19
      - 10.x-1.19.3
      - 11.x-1.19.4
      - 11.x-23w13a_or_b
      - 12.x-1.20
      - 13.x-1.20.2
      - 14.x-1.20.4
      - 15.x-1.20.5
      - 16.x-1.21
      - 17.x-1.21.2
      - 18.x-1.21.4
      - 19.x-1.21.5
      - 20.x-1.21.6
      - 1.21.9
      - 1.21.11
      - 26.1

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Upload Mod
        run: ./gradlew build publish publishUnified --stacktrace
        env:
          danielshe_curse_api_key: ${{ secrets.CF_API_KEY }}
          modrinth_key: ${{ secrets.MODRINTH_KEY }}
          BRANCH_NAME: ${{ github.ref }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}

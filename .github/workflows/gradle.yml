name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --stacktrace
